name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - run: uv sync --locked
      - name: Retomada independente do terminal
        run: uv run --frozen python -m pytest tests/test_segundo_plano.py -q
      - run: uv run --frozen ruff check src tests scripts .github/scripts
      - name: Links e imagens da documentação
        run: uv run --frozen python .github/scripts/verificar_docs.py
      - run: uv run --frozen python -m pytest -q
      - run: node --test tests/js/*.test.cjs
      - run: uv build
      - run: uv run --frozen python scripts/verificar_pacote.py dist

  navegador:
    name: Jornadas desktop e mobile / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --group browser
      - run: uv run --frozen --group browser playwright install --with-deps chromium
      - run: uv run --frozen --group browser python scripts/verificar_interface.py
      - run: uv run --frozen --group browser python scripts/verificar_grafo.py
      - run: uv run --frozen --group browser python scripts/verificar_editor.py
      - run: uv run --frozen --group browser python scripts/verificar_contatos.py

  mcp-compativel:
    name: MCP SDK ${{ matrix.mcp }} / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mcp: ['1.30.0', '2.3.0']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
          python-version: '3.11'
      - run: uv sync --locked
      # Esta matriz verifica versões suportadas além da versão fixada em uv.lock.
      - run: uv pip install "mcp==${{ matrix.mcp }}"
      - run: uv run --no-sync python -m pytest tests/test_mcp_protocolo.py -q

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv export --frozen --format requirements-txt --no-emit-project --output-file requirements-audit.txt
      - run: uv run --frozen pip-audit --requirement requirements-audit.txt --no-deps --disable-pip

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_LOG_OPTS: '--all'
