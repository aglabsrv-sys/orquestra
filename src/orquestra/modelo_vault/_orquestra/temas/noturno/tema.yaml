# Tema Noturno: cidade cyberpunk. Violeta elétrico, magenta e ciano.
# Cores sempre em hexadecimal. Salve e o painel recarrega sozinho.

nome: Noturno
descricao: Cyberpunk em violeta elétrico, magenta e ciano.

# Cores da interface
cores:
  fundo: "#0c0816"
  superficie: "#170f26"
  superficie_alta: "#25173c"
  borda: "#44305e"
  texto: "#f4eaff"
  texto_suave: "#b8a2cc"
  destaque: "#d38aff"
  sobre_destaque: "#200a35"
  alerta: "#ff719e"
  ok: "#68efda"

# As mesmas cores para o modo claro (Ajustes > Aparência > Claro).
cores_claras:
  fundo: "#f7f6fd"
  superficie: "#ffffff"
  superficie_alta: "#ebe8fa"
  borda: "#d6d1f0"
  texto: "#1b1838"
  texto_suave: "#6a6690"
  destaque: "#6b46d6"
  sobre_destaque: "#ffffff"
  alerta: "#c7305a"
  ok: "#22805a"

# Paletas das capas em pixel art (os papéis de cada cor estão em docs/temas.md).
paletas:
  madrugada:
    ceu: ["#06051a", "#12103a", "#2a1f6a", "#5a3f9a"]
    astro: "#f4efff"
    nuvem: "#4a3d8f"
    longe: "#2a2166"
    meio: "#1a1547"
    perto: "#0f0c2e"
    sombra: "#070517"
    luz: "#ffd86b"
    brilho: "#ffffff"
    noite: true
  aurora:
    ceu: ["#070b24", "#152a5a", "#2a7a8a", "#7ae0b0"]
    astro: "#eafff4"
    nuvem: "#5ac0b0"
    longe: "#1c3a6a"
    meio: "#12264a"
    perto: "#0b1730"
    sombra: "#060c1c"
    luz: "#b6ff9a"
    brilho: "#f0fff8"
    noite: true
  neon:
    ceu: ["#0d0524", "#3a0f5a", "#a02a8a", "#ff6aa8"]
    astro: "#ffe0f0"
    nuvem: "#ff5fc8"
    longe: "#4a1a6a"
    meio: "#2c1048"
    perto: "#1a0930"
    sombra: "#0c041a"
    luz: "#6af0ff"
    brilho: "#ffffff"
    noite: true
  lilas:
    ceu: ["#1a1440", "#4a3a8a", "#9a7ad0", "#f0c0e8"]
    astro: "#fff4fb"
    nuvem: "#e0c0f0"
    longe: "#5a4a9a"
    meio: "#3a2f70"
    perto: "#231c4a"
    sombra: "#120e2c"
    luz: "#ffe38a"
    brilho: "#ffffff"

# O estilo deste tema: madrugada de néon: letreiros, chuva, espaço e aurora.
# `cenas` é a ordem de preferência para as áreas que não estão listadas em `capas`.
# Cenas disponíveis: janela, cidade, montanhas, mar, floresta, espaco, ceu, aurora, deserto, observatorio, jardim, orbital, codigo, neon, recife
cenas: [neon, cidade, espaco, janela, aurora, orbital]

# Qual cena e qual paleta cada área usa neste tema. Cada par aparece uma vez só,
# para duas áreas nunca ficarem com a mesma capa. `boas-vindas` é a capa que
# representa o tema na tela de escolha.
capas:
  boas-vindas: {cena: neon, paleta: neon}
  tarefas: {cena: janela, paleta: lilas}
  conteudo: {cena: neon, paleta: lilas}
  radar: {cena: espaco, paleta: madrugada}
  entrada: {cena: cidade, paleta: neon}
  decidir: {cena: montanhas, paleta: aurora}
  diario: {cena: floresta, paleta: madrugada}
  pastas: {cena: aurora, paleta: madrugada}
  numeros: {cena: espaco, paleta: neon}
  notas: {cena: janela, paleta: madrugada}
  projetos: {cena: neon, paleta: madrugada}
  areas: {cena: floresta, paleta: aurora}
  recursos: {cena: cidade, paleta: madrugada}
  arquivos: {cena: espaco, paleta: lilas}
  clientes: {cena: cidade, paleta: lilas}
  financas: {cena: orbital, paleta: neon}
  estudos: {cena: aurora, paleta: aurora}
  agenda: {cena: orbital, paleta: lilas}
  habitos: {cena: neon, paleta: aurora}
