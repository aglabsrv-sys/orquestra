# Tema Grafite: interface em cinza neutro, com capas em tons pastel.
# Cores sempre em hexadecimal. Salve e o painel recarrega sozinho.

nome: Grafite
descricao: Cinza neutro e discreto, com capas em tons pastel.

# Cores da interface
cores:
  fundo: "#101113"
  superficie: "#18191c"
  superficie_alta: "#222428"
  borda: "#34373d"
  texto: "#eeeff1"
  texto_suave: "#a3a7ae"
  destaque: "#e3e6eb"
  sobre_destaque: "#17181b"
  alerta: "#ff9789"
  ok: "#9bd6bb"

# As mesmas cores para o modo claro (Ajustes > Aparência > Claro).
cores_claras:
  fundo: "#f6f6f7"
  superficie: "#ffffff"
  superficie_alta: "#eaebed"
  borda: "#d4d6da"
  texto: "#17181b"
  texto_suave: "#5c6068"
  destaque: "#2a2c31"
  sobre_destaque: "#ffffff"
  alerta: "#b8322c"
  ok: "#22744b"

# Paletas das capas em pixel art (os papéis de cada cor estão em docs/temas.md).
paletas:
  lavanda:
    ceu: ["#2b2a3a", "#4a4766", "#8a84b0", "#d6cfe8"]
    astro: "#fff4e6"
    nuvem: "#efe6f5"
    longe: "#6f6a8f"
    meio: "#4f4b68"
    perto: "#34324a"
    sombra: "#1e1d2b"
    luz: "#ffd9a8"
    brilho: "#ffffff"
  pessego:
    ceu: ["#3a2e33", "#6e5560", "#d9a59a", "#f6dcc8"]
    astro: "#fff6e8"
    nuvem: "#fbe8dc"
    longe: "#a07f86"
    meio: "#6f5862"
    perto: "#463840"
    sombra: "#272025"
    luz: "#ffe2b0"
    brilho: "#ffffff"
  menta:
    ceu: ["#22302d", "#3f5a54", "#8cbcae", "#d9efe6"]
    astro: "#fffbea"
    nuvem: "#eef8f3"
    longe: "#6a8f86"
    meio: "#486660"
    perto: "#2f4440"
    sombra: "#1a2624"
    luz: "#fff0b8"
    brilho: "#ffffff"
  nevoa:
    ceu: ["#1b2130", "#343f58", "#7487a8", "#c9d5e6"]
    astro: "#fffaf0"
    nuvem: "#e4eaf3"
    longe: "#5c6c88"
    meio: "#414c63"
    perto: "#2b3343"
    sombra: "#161b25"
    luz: "#ffe6b5"
    brilho: "#ffffff"
    noite: true

# O estilo deste tema: paisagens suaves em lavanda, pêssego, menta e azul-névoa.
# `cenas` é a ordem de preferência para as áreas que não estão listadas em `capas`.
# Cenas disponíveis: janela, cidade, montanhas, mar, floresta, espaco, ceu, aurora, deserto, observatorio, jardim, orbital, codigo, neon, recife
cenas: [montanhas, floresta, cidade, janela, mar, observatorio, ceu]

# Qual cena e qual paleta cada área usa neste tema. Cada par aparece uma vez só,
# para duas áreas nunca ficarem com a mesma capa. `boas-vindas` é a capa que
# representa o tema na tela de escolha.
capas:
  boas-vindas: {cena: montanhas, paleta: lavanda}
  tarefas: {cena: janela, paleta: lavanda}
  conteudo: {cena: cidade, paleta: nevoa}
  radar: {cena: observatorio, paleta: nevoa}
  entrada: {cena: mar, paleta: pessego}
  decidir: {cena: montanhas, paleta: pessego}
  diario: {cena: floresta, paleta: menta}
  pastas: {cena: floresta, paleta: lavanda}
  numeros: {cena: orbital, paleta: nevoa}
  notas: {cena: janela, paleta: pessego}
  projetos: {cena: montanhas, paleta: menta}
  areas: {cena: ceu, paleta: pessego}
  recursos: {cena: cidade, paleta: lavanda}
  arquivos: {cena: espaco, paleta: nevoa}
  clientes: {cena: cidade, paleta: pessego}
  financas: {cena: mar, paleta: menta}
  estudos: {cena: observatorio, paleta: lavanda}
  agenda: {cena: deserto, paleta: pessego}
  habitos: {cena: jardim, paleta: menta}
