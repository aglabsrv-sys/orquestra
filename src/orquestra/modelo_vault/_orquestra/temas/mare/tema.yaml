# Tema Maré: o mar por cima e por baixo. Verde-água profundo com destaque em coral.
# Cores sempre em hexadecimal. Salve e o painel recarrega sozinho.

nome: Maré
descricao: Verde-mar profundo com destaque em coral.

# Cores da interface
cores:
  fundo: "#081a1b"
  superficie: "#0f2627"
  superficie_alta: "#163435"
  borda: "#24494a"
  texto: "#ecf5f2"
  texto_suave: "#8fb0ab"
  destaque: "#ff9d8a"
  sobre_destaque: "#3a110b"
  alerta: "#ffc46b"
  ok: "#8fe3c0"

# As mesmas cores para o modo claro (Ajustes > Aparência > Claro).
cores_claras:
  fundo: "#f2f8f6"
  superficie: "#ffffff"
  superficie_alta: "#e2efeb"
  borda: "#c6dbd5"
  texto: "#0d2a2a"
  texto_suave: "#4f706b"
  destaque: "#b8402c"
  sobre_destaque: "#ffffff"
  alerta: "#a85a00"
  ok: "#1f7a4d"

# Paletas das capas em pixel art (os papéis de cada cor estão em docs/temas.md).
paletas:
  laguna:
    ceu: ["#04232e", "#0b4a55", "#1f8a84", "#8fd9b6"]
    astro: "#fbe9c8"
    nuvem: "#e6d9c2"
    longe: "#1c6b6f"
    meio: "#114a52"
    perto: "#0a2f38"
    sombra: "#051c23"
    luz: "#ffb49a"
    brilho: "#fff6e6"
  abissal:
    ceu: ["#020a12", "#051a28", "#0a3040", "#14505a"]
    astro: "#d8f7ee"
    nuvem: "#1f5560"
    longe: "#0d3945"
    meio: "#082732"
    perto: "#051922"
    sombra: "#020c12"
    luz: "#7ff0d0"
    brilho: "#eafff8"
    noite: true
  coral:
    ceu: ["#0c2a3a", "#2a5a70", "#e08a7a", "#ffd0a0"]
    astro: "#fff0c8"
    nuvem: "#ffb9a0"
    longe: "#3a6a7a"
    meio: "#234a5a"
    perto: "#122f3d"
    sombra: "#081c26"
    luz: "#ffc27a"
    brilho: "#fffbe8"
  musgo:
    ceu: ["#06140f", "#0f2e22", "#1f5a40", "#5fa37a"]
    astro: "#f6ffcf"
    nuvem: "#9fd0a8"
    longe: "#1f5238"
    meio: "#143a29"
    perto: "#0b241a"
    sombra: "#06150f"
    luz: "#e9ff8f"
    brilho: "#fbffe6"
    noite: true

# O estilo deste tema: o mar visto da praia e do fundo: farol, recife e céu limpo.
# `cenas` é a ordem de preferência para as áreas que não estão listadas em `capas`.
# Cenas disponíveis: janela, cidade, montanhas, mar, floresta, espaco, ceu, aurora, deserto, observatorio, jardim, orbital, codigo, neon, recife
cenas: [mar, recife, ceu, aurora, montanhas, floresta, jardim]

# Qual cena e qual paleta cada área usa neste tema. Cada par aparece uma vez só,
# para duas áreas nunca ficarem com a mesma capa. `boas-vindas` é a capa que
# representa o tema na tela de escolha.
capas:
  boas-vindas: {cena: mar, paleta: laguna}
  tarefas: {cena: recife, paleta: laguna}
  conteudo: {cena: mar, paleta: coral}
  radar: {cena: aurora, paleta: abissal}
  entrada: {cena: ceu, paleta: laguna}
  decidir: {cena: montanhas, paleta: coral}
  diario: {cena: floresta, paleta: musgo}
  pastas: {cena: recife, paleta: abissal}
  numeros: {cena: ceu, paleta: coral}
  notas: {cena: janela, paleta: laguna}
  projetos: {cena: montanhas, paleta: laguna}
  areas: {cena: floresta, paleta: laguna}
  recursos: {cena: recife, paleta: coral}
  arquivos: {cena: espaco, paleta: abissal}
  clientes: {cena: cidade, paleta: coral}
  financas: {cena: mar, paleta: abissal}
  estudos: {cena: aurora, paleta: musgo}
  agenda: {cena: mar, paleta: musgo}
  habitos: {cena: jardim, paleta: musgo}
